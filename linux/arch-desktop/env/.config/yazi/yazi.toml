[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
linemode = "size"
ratio = [1, 3, 4]

[preview]
max_width = 1000
max_height = 1000

[opener]
edit = [
    { run = 'nvim %s', block = true, for = "unix" },
]

open = [
    { run = 'xdg-open %s1', orphan = true, for = "linux" },
]

[open]
rules = [
    { url = "*/", use = ["open", "edit"] },
    { mime = "text/*", use = ["edit"] },
    { mime = "image/*", use = ["open"] },
    { mime = "video/*", use = ["open"] },
    { mime = "audio/*", use = ["open"] },
    { mime = "application/pdf", use = ["open"] },
    { url = "*", use = ["open"] },
]
